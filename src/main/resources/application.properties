spring.application.name=sb-ecom

spring.datasource.url=${ECOM_DATASOURCE_URL:jdbc:h2:mem:ecom;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${ECOM_DATASOURCE_USERNAME:sa}
spring.datasource.password=${ECOM_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${ECOM_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${ECOM_JPA_DDL_AUTO:update}
spring.jpa.database-platform=${ECOM_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

project.image=${ECOM_IMAGE_DIR:images/}

spring.app.jwtSecret=${ECOM_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==}
spring.app.jwtExpirationMs=${ECOM_JWT_EXPIRATION_MS:3000000}
spring.ecom.app.jwtCookieName=${ECOM_JWT_COOKIE_NAME:springBootEcom}

spring.ecom.seed.userPassword=${ECOM_SEED_USER_PASSWORD:change-me-user}
spring.ecom.seed.sellerPassword=${ECOM_SEED_SELLER_PASSWORD:change-me-seller}
spring.ecom.seed.adminPassword=${ECOM_SEED_ADMIN_PASSWORD:change-me-admin}
